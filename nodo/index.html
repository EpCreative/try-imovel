<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}</style>
<title>NØDO Explorar</title>
<meta name="description" content="Prévia do NØDO Explorar: o catálogo NØDO em uma grade 3D interativa.">
<meta name="theme-color" content="#f2ede4">
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo-variable.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-variable.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-variable-italic.woff2) format("woff2");font-weight:200 800;font-style:italic;font-display:swap}
:root{--font-archivo:"Archivo";--font-newsreader:"Newsreader"}
html,body{height:100%}
button{font:inherit}
.preview-notice{position:fixed;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%);width:min(26rem,calc(100vw - 2rem));padding:1.75rem;background:var(--nodo-bone);color:var(--nodo-charcoal);border:1px solid #cfc7b9;box-shadow:0 20px 60px rgb(23 22 21 / .18);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.preview-notice h2{margin:0;font-size:1.75rem;font-weight:820;font-stretch:72%;line-height:1}
.preview-notice p{margin:.75rem 0 1.25rem;line-height:1.5;color:var(--nodo-charcoal-soft)}
.preview-notice__close{display:inline-flex;align-items:center;min-height:44px;padding:0 1.25rem;background:var(--nodo-wine);color:var(--nodo-bone);font-weight:600}
.preview-notice__close:focus-visible{outline:2px solid var(--nodo-wine);outline-offset:2px}

:root {
  /* NØDO brand palette (from the store's src/styles/tokens.css) */
  --nodo-charcoal: #171615;
  --nodo-bone: #f2ede4;
  --nodo-clay: #a85f55;
  --nodo-wine: #4a2028;
  --nodo-mist: #b9b5ae;
  --nodo-clay-light: #c9877c;
  --nodo-bone-deep: #e6dfd2;
  --nodo-charcoal-soft: #3a3735;
  --nodo-stone: #5e5a55;
  --nodo-wine-deep: #35161c;

  --background: var(--nodo-bone);
  --foreground: var(--nodo-charcoal);
  --cut: clamp(14px, 1rem + 1vw, 28px);
  color-scheme: light;
}

html,
body {
  max-width: 100vw;
  overflow-x: hidden;
}

body {
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-archivo), "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

a {
  color: inherit;
  text-decoration: none;
}

/* next/font variables live on <main>; set the family there so dialogs inherit it */
main {
  font-family: var(--font-archivo), "Helvetica Neue", Arial, sans-serif;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* --- Age confirmation (wine band, chamfered corner as in the store) --- */
.age-gate {
  margin: auto;
  width: min(34rem, calc(100vw - 2rem));
  padding: 0;
  border: 0;
  background: var(--nodo-wine);
  color: var(--nodo-bone);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
}
.age-gate::backdrop {
  background: rgb(23 22 21 / 0.85);
  backdrop-filter: blur(4px);
}
.age-gate__body {
  position: relative;
  overflow: hidden;
  padding: clamp(2rem, 1.5rem + 2vw, 2.5rem);
}
.age-gate__mark {
  position: absolute;
  top: -2.5rem;
  right: -2.5rem;
  width: 12rem;
  height: 12rem;
  color: rgb(201 135 124 / 0.4);
}
.age-gate h2 {
  position: relative;
  margin: 0;
  font-size: clamp(2rem, 1.4rem + 2.4vw, 2.75rem);
  line-height: 0.95;
  font-weight: 820;
  font-stretch: 72%;
}
.age-gate p {
  position: relative;
  margin: 1rem 0 0;
  font-size: 1.0625rem;
  line-height: 1.5;
  color: #eadfd8;
}
.age-gate__actions {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 2rem;
}
.age-gate__primary,
.age-gate__secondary {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0 1.5rem;
  font: inherit;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 2px;
  cursor: pointer;
}
.age-gate__primary {
  border: 0;
  background: var(--nodo-bone);
  color: var(--nodo-wine);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
}
.age-gate__primary:hover {
  background: #ffffff;
}
.age-gate__secondary {
  border: 1px solid #c9a9a3;
  color: var(--nodo-bone);
}
.age-gate__primary:focus-visible,
.age-gate__secondary:focus-visible {
  outline: 2px solid var(--nodo-bone);
  outline-offset: 2px;
}

/* --- Exit page --- */
.exit-page {
  min-height: 100vh;
  display: grid;
  place-content: center;
  gap: 0.75rem;
  padding: 1rem;
  text-align: center;
}
.exit-page h1 {
  margin: 0;
  font-size: clamp(2.75rem, 1.6rem + 4.6vw, 4.75rem);
  font-weight: 860;
  font-stretch: 72%;
  line-height: 0.95;
}
.exit-page p {
  margin: 0;
  color: var(--nodo-stone);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
<div id="nodo-explorar"></div>
<script src="app.js"></script>
</body>
</html>
